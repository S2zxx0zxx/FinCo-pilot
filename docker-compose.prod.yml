name: ${COMPOSE_PROJECT_NAME:-fincopilot}

x-podman:
  in_pod: false

x-backend-env: &backend-env
  DEPLOYMENT_ENVIRONMENT: production
  # Production secrets are file-mounted below. Keeping values out of the
  # Compose environment prevents `docker compose config` / process-env leaks.
  CREDENTIALS_DIRECTORY: /run/secrets
  DEBUG: ${DEBUG:-false}
  BILLING_CHECKOUT_ENABLED: ${BILLING_CHECKOUT_ENABLED:-false}
  BILLING_ACTIVATION_ENABLED: ${BILLING_ACTIVATION_ENABLED:-false}
  BILLING_RENEWAL_ENABLED: ${BILLING_RENEWAL_ENABLED:-false}
  BILLING_OFFER_RESERVATION_TTL_SECONDS: ${BILLING_OFFER_RESERVATION_TTL_SECONDS:-600}
