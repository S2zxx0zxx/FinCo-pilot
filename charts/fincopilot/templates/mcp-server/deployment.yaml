{{- if .Values.mcpServer.enabled }}
{{- $localAttachments := and .Values.persistence.attachments.enabled (eq (lower (toString .Values.config.storageProvider)) "local") -}}
{{- $agentKnowledge := and (eq (.Values.config.agentsEnabled | toString) "true") .Values.persistence.agentKnowledge.enabled -}}
{{- $agentEmbeddings := and (eq (.Values.config.agentsEnabled | toString) "true") .Values.persistence.agentEmbeddingModels.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fincopilot.fullname" . }}-mcp-server
  labels:
    {{- include "fincopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.mcpServer.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fincopilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        {{- include "fincopilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-server
    spec:
      initContainers:
        - name: release-prerequisites
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "scripts/prepare_release.py"]
          envFrom:
            - configMapRef:
                name: {{ include "fincopilot.fullname" . }}-config
            - secretRef:
                name: {{ default (printf "%s-secrets" (include "fincopilot.fullname" .)) .Values.global.existingSecret }}
      containers:
        - name: mcp-server
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServer.image.pullPolicy }}
          command:
            - uvicorn
            - mcp_server.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8765"
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: {{ include "fincopilot.fullname" . }}-config
            - secretRef:
                {{- if .Values.global.existingSecret }}
                name: {{ .Values.global.existingSecret }}
                {{- else }}
                name: {{ include "fincopilot.fullname" . }}-secrets
                {{- end }}
          {{- if or $localAttachments $agentKnowledge $agentEmbeddings }}
          volumeMounts:
            {{- if $localAttachments }}
            - name: attachments
              mountPath: /app/data/attachments
            {{- end }}
            {{- if $agentKnowledge }}
            - name: agent-knowledge
              mountPath: /app/data/agent_knowledge
            {{- end }}
            {{- if $agentEmbeddings }}
            - name: agent-embedding-models
              mountPath: /app/data/embedding_models
            {{- end }}
          {{- end }}
          {{- if .Values.mcpServer.resources }}
          resources:
            {{- toYaml .Values.mcpServer.resources | nindent 12 }}
          {{- end }}
      {{- if or $localAttachments $agentKnowledge $agentEmbeddings }}
      volumes:
        {{- if $localAttachments }}
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ include "fincopilot.fullname" . }}-attachments
        {{- end }}
        {{- if $agentKnowledge }}
        - name: agent-knowledge
          persistentVolumeClaim:
            claimName: {{ include "fincopilot.fullname" . }}-agent-knowledge
        {{- end }}
        {{- if $agentEmbeddings }}
        - name: agent-embedding-models
          persistentVolumeClaim:
            claimName: {{ include "fincopilot.fullname" . }}-agent-embedding-models
        {{- end }}
      {{- end }}
{{- end }}
