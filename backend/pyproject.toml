[project]
name = "fincopilot-backend"
version = "0.15.1"
description = "FinCo-Pilot API - Personal Finance Manager"
requires-python = ">=3.11"
# These ranges express intent; the resolved versions live in uv.lock, which is
# what CI and the Docker image actually install (exported with --frozen and
# fed to pip with hash checking). After changing anything here, run
# scripts/lock.sh and commit the updated uv.lock — CI fails if it drifts.
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography==46.0.7",
    "passlib[bcrypt]>=1.7.4",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "ofxparse>=0.21",
    "celery[redis]>=5.3.0",
    "aiofiles>=24.0",
    "boto3>=1.35.0",
    "redis[hiredis]>=5.0.0",
    "pyotp>=2.9.0",
    "webauthn>=2.8.0",
    "yfinance>=1.3.0",
    "pgvector>=0.3.0",
    "pypdf>=5.0.0",
    "reportlab>=4.2.0",
    "pyzipper>=0.4.0",
    "fastembed>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.6.1",
    "httpx>=0.26.0",
    "aiosqlite>=0.19.0",
    "ruff>=0.16.4,<0.17",
    "ty==0.0.79",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
omit = [
    "app/cli.py",
    "app/worker.py",
    "app/tasks/*",
    "app/providers/market_price.py",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E711", "E712"]
