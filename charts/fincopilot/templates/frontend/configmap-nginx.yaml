apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fincopilot.fullname" . }}-frontend-nginx
  labels:
    {{- include "fincopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf.template: |
    log_format finco_private '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    # Preserve the original HTTPS scheme from a trusted edge/ingress proxy.
    # Unknown values fall back to the pod-local Nginx scheme.
    map $http_x_forwarded_proto $finco_forwarded_proto {
        default $scheme;
        https https;
    }

    map $uri $finco_recovery_cache_control {
        default "";
        /reset-password "no-store";
        /verify-email "no-store";
    }

    server {
        listen 8080;
        add_header Cache-Control $finco_recovery_cache_control always;
        access_log /var/log/nginx/access.log finco_private;
        add_header Referrer-Policy "no-referrer" always;
        root /usr/share/nginx/html;
        index index.html;

        # API proxy to backend.
        # Resolve the backend hostname at request time instead of caching the IP
        # at startup. Without this, Nginx pins the upstream IP when the config
        # loads and returns 502s after the backend pod is recreated with a new
        # IP. Using a variable in proxy_pass forces re-resolution; NGINX_RESOLVER
        # is derived from the pod's own /etc/resolv.conf (cluster DNS) by the
        # image's docker-entrypoint.d/19-resolver.envsh.
        location /api/ {
            resolver ${NGINX_RESOLVER} valid=5s;
            set $upstream ${BACKEND_URL};
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $finco_forwarded_proto;
        }

        # Never cache index.html so new deployments are always picked up immediately
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files $uri =404;
        }

        location ~ ^/(reset-password|verify-email)$ {
            error_log /dev/null;
            try_files /index.html =404;
        }

        # SPA fallback — serve index.html for all non-file routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
