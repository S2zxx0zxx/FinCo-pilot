name: One-shot FinCo-Pilot Identity Migration

on:
  push:
    branches:
      - rebrand/finco-pilot-zero-legacy

permissions:
  contents: write

jobs:
  migrate-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out rebrand branch
        uses: actions/checkout@v4
        with:
          ref: rebrand/finco-pilot-zero-legacy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Apply full FinCo-Pilot identity migration
        run: python scripts/rebrand_finco.py

      - name: Remove one-shot migration automation
        run: |
          rm -f scripts/rebrand_finco.py
          rm -f .github/workflows/rebrand-finco.yml

      - name: Verify no legacy identity remains in current tree
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEi 'securo|usesecuro|securo-finance|tassionoronha|(^|[^a-z])tassio([^a-z]|$)|rUqTKtQ9S4|ae627b744aaa2ba89d850ea541c311be|shell-logo|ShellLogo' -- . ':(exclude)LICENSE'; then
            echo 'Legacy identity text remains.' >&2
            exit 1
          fi
          legacy_paths=$(find . -path './.git' -prune -o \( -iname '*securo*' -o -iname '*shell-logo*' \) -print)
          if [ -n "$legacy_paths" ]; then
            echo 'Legacy identity path remains:' >&2
            printf '%s\n' "$legacy_paths" >&2
            exit 1
          fi

      - name: Validate Python syntax and migration chain
        run: |
          python -m compileall -q backend/app backend/mcp_server backend/scripts
          python backend/scripts/check_migration_chain.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit transformed tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No rebrand changes produced.' >&2
            exit 1
          fi
          git commit -m 'rebrand: migrate product identity to FinCo-Pilot'
          git push origin HEAD:rebrand/finco-pilot-zero-legacy
