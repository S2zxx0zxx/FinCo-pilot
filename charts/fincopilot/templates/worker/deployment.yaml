{{- if .Values.celeryWorker.enabled }}
{{- $localAttachments := and .Values.persistence.attachments.enabled (eq (lower (toString .Values.config.storageProvider)) "local") -}}
{{- $agentKnowledge := and (eq (.Values.config.agentsEnabled | toString) "true") .Values.persistence.agentKnowledge.enabled -}}
{{- $agentEmbeddings := and (eq (.Values.config.agentsEnabled | toString) "true") .Values.persistence.agentEmbeddingModels.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fincopilot.fullname" . }}-worker
  labels:
    {{- include "fincopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  replicas: {{ .Values.celeryWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "fincopilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/common/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "fincopilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-worker
    spec:
      terminationGracePeriodSeconds: {{ .Values.celeryWorker.terminationGracePeriodSeconds }}
      containers:
        - name: celery-worker
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.celeryWorker.image.pullPolicy }}
          command:
            - celery
            - -A
            - app.worker
            - worker
            - --loglevel=info
            - --hostname=worker@%h
            - --concurrency={{ .Values.celeryWorker.concurrency }}
            - --max-tasks-per-child={{ .Values.celeryWorker.maxTasksPerChild }}
          envFrom:
            - configMapRef:
                name: {{ include "fincopilot.fullname" . }}-config
            - secretRef:
                {{- if .Values.global.existingSecret }}
                name: {{ .Values.global.existingSecret }}
                {{- else }}
                name: {{ include "fincopilot.fullname" . }}-secrets
                {{- end }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'celery -A app.worker inspect ping -d "worker@$HOSTNAME" --timeout=5 2>/dev/null | grep -q pong'
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'celery -A app.worker inspect ping -d "worker@$HOSTNAME" --timeout=5 2>/dev/null | grep -q pong'
            initialDelaySeconds: 20
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          {{- if or $localAttachments $agentKnowledge $agentEmbeddings }}
          volumeMounts:
            {{- if $localAttachments }}
            - name: attachments
              mountPath: /app/data/attachments
            {{- end }}
            {{- if $agentKnowledge }}
            - name: agent-knowledge
              mountPath: /app/data/agent_knowledge
            {{- end }}
            {{- if $agentEmbeddings }}
            - name: agent-embedding-models
              mountPath: /app/data/embedding_models
            {{- end }}
          {{- end }}
          {{- if .Values.celeryWorker.resources }}
          resources:
            {{- toYaml .Values.celeryWorker.resources | nindent 12 }}
          {{- end }}
      {{- if or $localAttachments $agentKnowledge $agentEmbeddings }}
      volumes:
        {{- if $localAttachments }}
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ include "fincopilot.fullname" . }}-attachments
        {{- end }}
        {{- if $agentKnowledge }}
        - name: agent-knowledge
          persistentVolumeClaim:
            claimName: {{ include "fincopilot.fullname" . }}-agent-knowledge
        {{- end }}
        {{- if $agentEmbeddings }}
        - name: agent-embedding-models
          persistentVolumeClaim:
            claimName: {{ include "fincopilot.fullname" . }}-agent-embedding-models
        {{- end }}
      {{- end }}
{{- end }}
