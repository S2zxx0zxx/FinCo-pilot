name: Security Advisory Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '10 3 * * 1' # weekly; one bounded dependency/static review
  pull_request:
    paths:
      - 'backend/uv.lock'
      - 'backend/pyproject.toml'
      - 'frontend/package-lock.json'
      - '.github/workflows/security-audit.yml'

permissions:
  contents: read

concurrency:
  group: security-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisory-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: backend/.python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install pinned audit runner
        run: python -m pip install uv==0.12.10
      - name: Check repository secret hygiene without exposing candidates
        run: python backend/scripts/check_secret_hygiene.py
      - name: Audit pinned Python runtime dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/finco-security-runtime.txt >/dev/null
          uvx --from pip-audit==2.10.1 pip-audit -r /tmp/finco-security-runtime.txt --no-deps --disable-pip
      - name: Audit npm lockfile without installing or running dependency scripts
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=low
      - name: Fail on high confidence high severity Python static findings
        run: uvx --from bandit==1.9.4 bandit -r backend/app --severity-level high --confidence-level high -q
