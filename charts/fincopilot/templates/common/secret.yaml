{{- $environment := lower (toString .Values.config.deploymentEnvironment) }}
{{- if and (eq $environment "production") (not .Values.global.existingSecret) }}
{{- fail "FinCo-Pilot production requires global.existingSecret; do not render production credentials from committed values files" }}
{{- end }}
{{- if and (eq $environment "production") .Values.postgresql.enabled }}
{{- fail "FinCo-Pilot production requires external PostgreSQL; set postgresql.enabled=false and supply DATABASE_URL through global.existingSecret" }}
{{- end }}
{{- if and (eq $environment "production") (ne (lower (toString .Values.config.databaseExternalRequired)) "true") }}
{{- fail "FinCo-Pilot production requires config.databaseExternalRequired=true" }}
{{- end }}
{{- if and (eq $environment "production") (not (has (lower (toString .Values.config.dbSslMode)) (list "require" "verify-ca" "verify-full"))) }}
{{- fail "FinCo-Pilot production requires encrypted PostgreSQL transport via config.dbSslMode=require|verify-ca|verify-full" }}
{{- end }}
{{- if not .Values.global.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fincopilot.fullname" . }}-secrets
  labels:
    {{- include "fincopilot.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret }}
  {{- if $value }}
  {{ $key | snakecase | upper }}: {{ tpl (print $value) $ | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
