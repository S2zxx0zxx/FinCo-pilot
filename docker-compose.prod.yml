  TERMS_CANCELLATION_POLICY_EN: ${TERMS_CANCELLATION_POLICY_EN:-}
  TERMS_CANCELLATION_POLICY_HI: ${TERMS_CANCELLATION_POLICY_HI:-}
  PRIVACY_POLICY_PUBLISHED: ${PRIVACY_POLICY_PUBLISHED:-false}
  PRIVACY_POLICY_REVIEWED_VERSION: ${PRIVACY_POLICY_REVIEWED_VERSION:-}
  PRIVACY_POLICY_EFFECTIVE_DATE: ${PRIVACY_POLICY_EFFECTIVE_DATE:-}
  PRIVACY_CONTACT_NAME: ${PRIVACY_CONTACT_NAME:-}
  PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
  PRIVACY_CONTACT_ADDRESS: ${PRIVACY_CONTACT_ADDRESS:-}
  PRIVACY_PROCESSING_LOCATIONS: ${PRIVACY_PROCESSING_LOCATIONS:-}
  PRIVACY_INFRASTRUCTURE_PROVIDERS: ${PRIVACY_INFRASTRUCTURE_PROVIDERS:-}
  SUPPORT_ENABLED: ${SUPPORT_ENABLED:-false}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  SUPPORT_PORTAL_URL: ${SUPPORT_PORTAL_URL:-}
  SUPPORT_HELP_CENTER_URL: ${SUPPORT_HELP_CENTER_URL:-}
