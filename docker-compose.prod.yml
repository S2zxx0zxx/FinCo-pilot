name: ${COMPOSE_PROJECT_NAME:-fincopilot}

x-podman:
  in_pod: false

x-backend-env: &backend-env
  DEPLOYMENT_ENVIRONMENT: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for production}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set for production}
  DEBUG: ${DEBUG:-false}
  BILLING_CHECKOUT_ENABLED: ${BILLING_CHECKOUT_ENABLED:-false}
  BILLING_OFFER_RESERVATION_TTL_SECONDS: ${BILLING_OFFER_RESERVATION_TTL_SECONDS:-600}
  BILLING_TAX_DISPLAY_MODE: ${BILLING_TAX_DISPLAY_MODE:-unconfigured}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_PLAN_PRO_MONTHLY_ID: ${RAZORPAY_PLAN_PRO_MONTHLY_ID:-}
  RAZORPAY_PLAN_PRO_ANNUAL_ID: ${RAZORPAY_PLAN_PRO_ANNUAL_ID:-}
  RAZORPAY_PLAN_MAX_MONTHLY_ID: ${RAZORPAY_PLAN_MAX_MONTHLY_ID:-}
  METRICS_ENABLED: ${METRICS_ENABLED:-false}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  EMAIL_DELIVERY_REQUIRED: ${EMAIL_DELIVERY_REQUIRED:-true}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be the public https URL}
  SETUP_ENABLED: ${SETUP_ENABLED:-false}
  SETUP_TOKEN: ${SETUP_TOKEN:-}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
  PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
  PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
  PLUGGY_OAUTH_REDIRECT_URI: ${PLUGGY_OAUTH_REDIRECT_URI:-}
  ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
  ENABLE_BANKING_PRIVATE_KEY_FILE: ${ENABLE_BANKING_PRIVATE_KEY_FILE:-/app/secrets/enable_banking_private.pem}
  ENABLE_BANKING_API_URL: ${ENABLE_BANKING_API_URL:-https://api.enablebanking.com}
  ENABLE_BANKING_OAUTH_REDIRECT_URI: ${ENABLE_BANKING_OAUTH_REDIRECT_URI:-}
  SIMPLEFIN_ENABLED: ${SIMPLEFIN_ENABLED:-false}
  SIMPLEFIN_API_URL: ${SIMPLEFIN_API_URL:-https://bridge.simplefin.org}
  OIDC_ENABLED: ${OIDC_ENABLED:-false}
  OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-OIDC}
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
  OIDC_AUTO_REGISTER: ${OIDC_AUTO_REGISTER:-true}
  OIDC_EXISTING_USER_LINK_MODE: ${OIDC_EXISTING_USER_LINK_MODE:-disabled}
  OIDC_REQUIRE_VERIFIED_EMAIL: ${OIDC_REQUIRE_VERIFIED_EMAIL:-true}
  OIDC_SYNC_ROLES: ${OIDC_SYNC_ROLES:-false}
  OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-groups}
  OIDC_ADMIN_ROLES: ${OIDC_ADMIN_ROLES:-}
  OIDC_WORKSPACE_ROLE_MAP: ${OIDC_WORKSPACE_ROLE_MAP:-}
  LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
  OPENEXCHANGERATES_APP_ID: ${OPENEXCHANGERATES_APP_ID:?OPENEXCHANGERATES_APP_ID is required for truthful multi-currency totals}
  FX_SYNC_MODE: ${FX_SYNC_MODE:-on_demand}
  FX_ALLOW_UNSAFE_1TO1_FALLBACK: "false"
  REQUIRE_FX_PROVIDER: "true"
  TESOURO_DIRETO_ENABLED: ${TESOURO_DIRETO_ENABLED:-true}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  REDIS_URL: redis://redis:6379/0
  BANK_SYNC_LOCK_TTL_SECONDS: ${BANK_SYNC_LOCK_TTL_SECONDS:-300}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  STORAGE_LOCAL_PATH: /app/data/attachments
  REQUIRE_OBJECT_STORAGE: ${REQUIRE_OBJECT_STORAGE:-false}
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
  STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
  STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
  STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
  AGENTS_EXTERNAL_MCP_URL: ${AGENTS_EXTERNAL_MCP_URL:-}
  AGENTS_KNOWLEDGE_STORAGE_PATH: /app/data/agent_knowledge
  AGENTS_ENABLED: ${AGENTS_ENABLED:-false}
  AGENTS_BUILTIN_MCP_URL: ${AGENTS_BUILTIN_MCP_URL:-http://mcp-server:8765/mcp}
  AGENTS_EXTRA_MCP_SERVERS: ${AGENTS_EXTRA_MCP_SERVERS:-}
  AGENTS_MCP_JWT_SECRET: ${AGENTS_MCP_JWT_SECRET:?AGENTS_MCP_JWT_SECRET must be set even when agents are currently disabled}
  AGENTS_MCP_EXTERNAL_TTL_DAYS: ${AGENTS_MCP_EXTERNAL_TTL_DAYS:-90}
  AGENTS_CORE_COPILOT_DAILY_MESSAGES: ${AGENTS_CORE_COPILOT_DAILY_MESSAGES:-50}
  AGENTS_DEFAULT_PROVIDER: ${AGENTS_DEFAULT_PROVIDER:-ollama}
  AGENTS_DEFAULT_MODEL: ${AGENTS_DEFAULT_MODEL:-}
  AGENTS_OLLAMA_BASE_URL: ${AGENTS_OLLAMA_BASE_URL:-http://ollama:11434}
  AGENTS_OPENAI_API_KEY: ${AGENTS_OPENAI_API_KEY:-}
  AGENTS_ANTHROPIC_API_KEY: ${AGENTS_ANTHROPIC_API_KEY:-}
  AGENTS_OPENAI_COMPAT_BASE_URL: ${AGENTS_OPENAI_COMPAT_BASE_URL:-}
  AGENTS_OPENAI_COMPAT_API_KEY: ${AGENTS_OPENAI_COMPAT_API_KEY:-}
  AGENTS_EMBEDDING_PROVIDER: ${AGENTS_EMBEDDING_PROVIDER:-native}
  AGENTS_EMBEDDING_MODEL: ${AGENTS_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}

x-backend-base: &backend-base
  image: ghcr.io/s2zxx0zxx/fincopilot-backend:${FINCOPILOT_VERSION:?FINCOPILOT_VERSION must pin an immutable release tag}
  environment: *backend-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  volumes:
    - ./secrets:/app/secrets:ro
    - attachments:/app/data/attachments
    - agent_knowledge:/app/data/agent_knowledge
    - agent_embedding_models:/app/data/embedding_models
  restart: unless-stopped

services:
  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: ${DB_IMAGE:-docker.io/pgvector/pgvector:pg16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
      POSTGRES_DB: ${POSTGRES_DB:-fincopilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    <<: *backend-base
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # Loopback-only diagnostics. Public traffic must reach the backend through
    # the bundled frontend/reverse proxy so trusted-proxy rate limiting cannot
    # be bypassed with spoofed X-Forwarded-For headers.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    image: ghcr.io/s2zxx0zxx/fincopilot-frontend:${FINCOPILOT_VERSION:?FINCOPILOT_VERSION must pin an immutable release tag}
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    environment:
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    <<: *backend-base
    command: celery -A app.worker worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}

  celery-beat:
    <<: *backend-base
    command: celery -A app.worker beat --loglevel=info

  mcp-server:
    <<: *backend-base
    profiles: [agents]
    command: uvicorn mcp_server.main:app --host 0.0.0.0 --port 8765
    ports:
      - "${AGENTS_MCP_EXTERNAL_HOST_PORT:-127.0.0.1:8765}:8765"

volumes:
  pgdata:
  attachments:
  agent_knowledge:
  agent_embedding_models: