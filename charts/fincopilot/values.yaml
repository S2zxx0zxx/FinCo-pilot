# Default values for fincopilot.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # The public domain of the application (e.g., fincopilot.local, app.fincopilot.com)
  domain: "fincopilot.local"
  # Set to true if the application is accessed over HTTPS (changes generated URLs)
  tls: false

  # For production, we recommend passing existingSecret instead of creating one via Helm values
  # existingSecret: "fincopilot-secrets"

# If existingSecret is NOT set, this secret will be created with the values below
secret:
  # Development only. Production uses global.existingSecret.
  credentialEncryptionKey: ""
  coreCopilotSigningKey: ""
  legacyDataKeys: ""
  # Development-only defaults. Production is fail-closed unless
  # global.existingSecret references an operator-managed Kubernetes Secret.
  secretKey: "dev-secret-change-in-production"
  # If postgresql.enabled is true, the internal database will be deployed.
  # If postgresql.enabled is false, you must provide your external database URL here or in existingSecret.
  databaseUrl: 'postgresql+asyncpg://postgres:postgres@{{ include "fincopilot.fullname" . }}-postgresql:5432/fincopilot'
  # Development-only bundled Redis URL. Production injects REDIS_URL from
  # global.existingSecret and never renders it from committed values.
  redisUrl: 'redis://{{ include "fincopilot.fullname" . }}-redis-master:6379/0'

  # Pluggy
  pluggyClientId: ""
  pluggyClientSecret: ""

  # Enable Banking
  enableBankingAppId: ""
  enableBankingPrivateKey: "" # Content of the PEM file

  # OIDC
  oidcClientId: ""
  oidcClientSecret: ""

  # OpenExchangeRates
  openexchangeratesAppId: ""

  # Bootstrap / SMTP / metrics
  setupToken: ""
  smtpPassword: ""
  metricsToken: ""

  # S3-compatible storage credentials
  storageS3AccessKey: ""
  storageS3SecretKey: ""

  # Razorpay payment credentials. Prefer global.existingSecret in production.
  razorpayKeyId: ""
  razorpayKeySecret: ""
  razorpayWebhookSecret: ""
  razorpayWebhookPreviousSecret: ""

  # Agents (LLM)
  agentsMcpJwtSecret: "dev-mcp-secret-change-in-production"
  agentsOpenaiApiKey: ""
  agentsAnthropicApiKey: ""
  agentsOpenaiCompatApiKey: ""
  agentsEmbeddingOpenaiApiKey: ""

  # Zoho Desk direct-ticket OAuth secrets. Prefer global.existingSecret in production.
  zohoDeskClientSecret: ""
  zohoDeskRefreshToken: ""

# Non-sensitive configuration
config:
  razorpayWebhookMode: "test"
  razorpayWebhookEnabled: false
  razorpayWebhookAccountId: ""
  razorpayWebhookPreviousSecretExpiresAt: "0"
  # Leave development for chart smoke/lint. Set production only together with
  # global.existingSecret; templates deliberately fail otherwise.
  deploymentEnvironment: "development"
  debug: "false"

  # PostgreSQL runtime. Development chart defaults remain local-friendly.
  # Production rendering requires postgresql.enabled=false,
  # databaseExternalRequired=true and encrypted DB transport.
  databaseExternalRequired: "false"
  dbSslMode: "prefer"
  dbSslCaFile: ""
  dbPoolMode: "queue"
  dbPoolSize: "5"
  dbMaxOverflow: "5"
  dbPoolTimeoutSeconds: "15"
  dbPoolRecycleSeconds: "900"
  dbConnectTimeoutSeconds: "10"
  dbCommandTimeoutSeconds: "30"
  dbStatementTimeoutMs: "30000"
  dbIdleTransactionTimeoutMs: "30000"
  dbPreparedStatementCacheSize: "100"
  dbApplicationName: "fincopilot"

  # Public operator/business identity. These are non-secret descriptors of who
  # operates this FinCo-Pilot deployment; do not use them to imply incorporation
  # or registration that has not actually occurred.
  operatorIdentityEnabled: "true"
  operatorBrandName: "FinCo-Pilot"
  operatorEntityType: "individual"
  operatorCountryCode: "IN"
  operatorLegalName: ""
  # Deliberately public facts; blank defaults keep privacy notice a draft.
  termsPublished: "false"
  termsReviewedVersion: ""
  termsEffectiveDate: ""
  termsContactName: ""
  termsContactEmail: ""
  termsContactAddress: ""
  termsContactPhone: ""
  termsContactDesignation: ""
  termsPublicWebsite: ""
  termsRefundPolicyEn: ""
  termsRefundPolicyHi: ""
  termsCancellationPolicyEn: ""
  termsCancellationPolicyHi: ""
  privacyPolicyPublished: "false"
  privacyPolicyReviewedVersion: ""
  privacyPolicyEffectiveDate: ""
  privacyContactName: ""
  privacyContactEmail: ""
  privacyContactAddress: ""
  privacyProcessingLocations: ""
  privacyInfrastructureProviders: ""

  # Customer support / trust layer. Disabled until a real inbox/portal exists.
  supportEnabled: "false"
  supportEmail: ""
  supportPortalUrl: ""
  supportHelpCenterUrl: ""
  supportSecurityUrl: "https://github.com/S2zxx0zxx/FinCo-pilot/security/advisories/new"
  supportProvider: "external"
  supportTicketSubmissionEnabled: "false"
  supportRateLimitPerHour: "6"
  zohoDeskAccountsDomain: "https://accounts.zoho.in"
  zohoDeskApiDomain: "https://desk.zoho.in"
  zohoDeskOrgId: ""
  zohoDeskDepartmentId: ""
  zohoDeskClientId: ""

  # Billing / founder offer engine. Paid checkout is fail-closed by default.
  billingCheckoutEnabled: "false"
  billingActivationEnabled: "false"
  billingRefundsEnabled: "false"
  billingRenewalEnabled: "false"
  billingOfferReservationTtlSeconds: "600"
  billingTaxDisplayMode: "unconfigured"
  # Razorpay base recurring plan IDs. Test and Live installations use
  # different provider IDs and must be provisioned explicitly.
  razorpayPlanProMonthlyId: ""
  razorpayPlanProAnnualId: ""
  razorpayPlanMaxMonthlyId: ""
  # Set false only when oidc.enabled, oidc.clientId, and oidc.discoveryUrl are configured.
  localAuthEnabled: "true"
  # #17: set delivery required in production; supply SMTP_PASSWORD via existingSecret.
  emailDeliveryRequired: "false"
  smtpHost: ""
  smtpPort: "587"
  smtpUsername: ""
  smtpFromEmail: ""
  smtpStarttls: "true"
  smtpUseSsl: "false"
  smtpSslCaFile: ""
  smtpTimeoutSeconds: "10"
  smtpMaxConcurrentSends: "4"
  # Leave empty to auto-compute from global.domain (e.g. http://fincopilot.local/oauth/callback)
  pluggyOauthRedirectUri: ""
  enableBankingApiUrl: "https://api.enablebanking.com"
  # Leave empty to auto-compute from global.domain
  enableBankingOauthRedirectUri: ""
  simplefinEnabled: "false"
  simplefinApiUrl: "https://beta-bridge.simplefin.org"
  oidcEnabled: "false"
  oidcProviderName: "OIDC"
  oidcDiscoveryUrl: ""
  oidcRedirectUri: ""
  oidcScopes: "openid email profile"
  oidcAutoRegister: "true"
  # Link OIDC logins to existing accounts with the same email: disabled, verified_email, or email
  oidcExistingUserLinkMode: "disabled"
  oidcRequireVerifiedEmail: "true"
  oidcSyncRoles: "false"
  oidcRolesClaim: "groups"
  oidcAdminRoles: ""
  oidcWorkspaceRoleMap: ""
  # Production: scheduled, requireFxProvider=true, unsafe fallback=false.
  fxSyncMode: "on_demand"
  requireFxProvider: "false"
  fxAllowUnsafe1to1Fallback: "true"
  tesouroDiretoEnabled: "true"

  # Redis/Celery runtime. REDIS_URL itself is secret material and lives in
  # secret.redisUrl for development or global.existingSecret in production.
  # Production requires redis.enabled=false plus external/TLS/auth gates.
  redisExternalRequired: "false"
  redisTlsRequired: "false"
  redisAuthRequired: "false"
  redisSslCaFile: ""
  redisMaxConnections: "50"
  redisSocketConnectTimeoutSeconds: "5"
  redisSocketTimeoutSeconds: "5"
  redisHealthCheckIntervalSeconds: "30"
  celeryResultExpiresSeconds: "86400"
  celeryVisibilityTimeoutSeconds: "3600"
  celeryWorkerPrefetchMultiplier: "1"

  # Object storage. Development remains local-friendly; production Helm
  # validation requires the selected private Cloudflare R2 contract.
  storageProvider: "local"
  requireObjectStorage: "false"
  storageLocalPath: "/app/data/attachments"
  storageS3Vendor: "generic"
  storageS3Bucket: ""
  storageS3Region: ""
  storageS3EndpointUrl: ""
  storageS3Prefix: "fincopilot"
  storageS3RequestTimeoutSeconds: "30"
  storageS3PresignTtlSeconds: "300"

  agentsKnowledgeStoragePath: "/app/data/agent_knowledge"

  # Agents feature
  agentsEnabled: "false"
  agentsBuiltinMcpUrl: 'http://{{ include "fincopilot.fullname" . }}-mcp-server:8765/mcp'
  agentsExternalMcpUrl: '{{ include "fincopilot.frontendUrl" . }}/mcp'
  agentsExtraMcpServers: ""
  agentsMcpExternalTtlDays: "90"
  agentsDefaultProvider: "ollama"
  agentsDefaultModel: ""
  agentsOllamaBaseUrl: "http://ollama:11434"
  agentsOpenaiCompatBaseUrl: ""
  agentsEmbeddingProvider: "native"
  agentsEmbeddingOpenaiBaseUrl: "https://api.openai.com/v1"
  agentsEmbeddingModel: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

# Backend configuration
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/s2zxx0zxx/fincopilot-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Frontend configuration
frontend:
  backendUrl: ""
  replicaCount: 1
  image:
    repository: ghcr.io/s2zxx0zxx/fincopilot-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Celery Worker configuration
celeryWorker:
  enabled: true
  replicaCount: 1
  concurrency: 2
  maxTasksPerChild: 200
  terminationGracePeriodSeconds: 90
  image:
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Celery Beat configuration
celeryBeat:
  enabled: true
  terminationGracePeriodSeconds: 30
  image:
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Built-in MCP Server configuration
mcpServer:
  enabled: false
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8765
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Persistence for application data
# IMPORTANT: Since Backend, Celery Worker, and MCP Server all share the same attachment files,
# they mount these PVCs concurrently. If your pods are scheduled across multiple nodes,
# you MUST use a StorageClass that supports `ReadWriteMany` (RWX) access mode (e.g., NFS, CephFS).
# `ReadWriteOnce` will only work if you restrict all pods to a single node.
persistence:
  attachments:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  agentKnowledge:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  agentEmbeddingModels:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Standard Kubernetes Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  tls: []
  #  - secretName: fincopilot-tls
  #    hosts:
  #      - fincopilot.local

httpRoute:
  enabled: false
  parentRefs: []
  # - name: external-gateway
  #   namespace: gateway-system
  # Path matches will route /api to backend and / to frontend.

# Development/local fallback PostgreSQL. Production must disable this and
# supply DATABASE_URL through global.existingSecret.
postgresql:
  enabled: true
  image:
    repository: docker.io/pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  resources: {}

# Development/local fallback Redis. Production must disable this and inject
# REDIS_URL through global.existingSecret.
redis:
  enabled: true
  image:
    repository: docker.io/library/redis
    tag: 8-alpine
    pullPolicy: IfNotPresent
  resources: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
