  RAZORPAY_WEBHOOK_MODE: ${RAZORPAY_WEBHOOK_MODE:-test}
  RAZORPAY_WEBHOOK_ENABLED: ${RAZORPAY_WEBHOOK_ENABLED:-false}
  RAZORPAY_WEBHOOK_ACCOUNT_ID: ${RAZORPAY_WEBHOOK_ACCOUNT_ID:-}
  RAZORPAY_WEBHOOK_PREVIOUS_SECRET_EXPIRES_AT: ${RAZORPAY_WEBHOOK_PREVIOUS_SECRET_EXPIRES_AT:-0}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_PLAN_PRO_MONTHLY_ID: ${RAZORPAY_PLAN_PRO_MONTHLY_ID:-}
  RAZORPAY_PLAN_PRO_ANNUAL_ID: ${RAZORPAY_PLAN_PRO_ANNUAL_ID:-}
  RAZORPAY_PLAN_MAX_MONTHLY_ID: ${RAZORPAY_PLAN_MAX_MONTHLY_ID:-}
  METRICS_ENABLED: ${METRICS_ENABLED:-false}
  EMAIL_DELIVERY_REQUIRED: ${EMAIL_DELIVERY_REQUIRED:-true}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
  SMTP_SSL_CA_FILE: ${SMTP_SSL_CA_FILE:-}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
  SMTP_MAX_CONCURRENT_SENDS: ${SMTP_MAX_CONCURRENT_SENDS:-4}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be the public https URL}
