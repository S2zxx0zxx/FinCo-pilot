name: PWA Validation

on:
  push:
    branches: [feat/finco-power-pwa]

jobs:
  pwa-frontend:
    name: PWA Frontend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest JSON
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/manifest.webmanifest','utf8')); if(m.name!=='FinCo-Pilot'||m.display!=='standalone') process.exit(1); const sizes=new Set(m.icons.map(i=>i.sizes)); if(!sizes.has('192x192')||!sizes.has('512x512')) process.exit(1); if(!m.icons.some(i=>i.purpose==='maskable')) process.exit(1);"

      - name: Validate privacy-safe worker policy
        run: |
          grep -q "pathname.startsWith('/api/')" public/sw.js
          grep -q "request.method !== 'GET'" public/sw.js
          grep -q "android-icon-maskable-512x512.png" public/manifest.webmanifest

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type check and build
        run: npm run build

      - name: Run tests
        run: npm test
