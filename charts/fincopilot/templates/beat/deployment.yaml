{{- if .Values.celeryBeat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fincopilot.fullname" . }}-beat
  labels:
    {{- include "fincopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fincopilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/common/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "fincopilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-beat
    spec:
      terminationGracePeriodSeconds: {{ .Values.celeryBeat.terminationGracePeriodSeconds }}
      initContainers:
        - name: release-prerequisites
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "scripts/prepare_release.py"]
          envFrom:
            - configMapRef:
                name: {{ include "fincopilot.fullname" . }}-config
            - secretRef:
                name: {{ default (printf "%s-secrets" (include "fincopilot.fullname" .)) .Values.global.existingSecret }}
      containers:
        - name: celery-beat
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.celeryBeat.image.pullPolicy }}
          command:
            - celery
            - -A
            - app.worker
            - beat
            - --loglevel=info
            - --pidfile=/tmp/celerybeat.pid
            - --schedule=/tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: {{ include "fincopilot.fullname" . }}-config
            - secretRef:
                {{- if .Values.global.existingSecret }}
                name: {{ .Values.global.existingSecret }}
                {{- else }}
                name: {{ include "fincopilot.fullname" . }}-secrets
                {{- end }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'test -s /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)'
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'test -s /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)'
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if .Values.celeryBeat.resources }}
          resources:
            {{- toYaml .Values.celeryBeat.resources | nindent 12 }}
          {{- end }}
{{- end }}
