  ZOHO_DESK_API_DOMAIN: ${ZOHO_DESK_API_DOMAIN:-https://desk.zoho.in}
  ZOHO_DESK_ORG_ID: ${ZOHO_DESK_ORG_ID:-}
  ZOHO_DESK_DEPARTMENT_ID: ${ZOHO_DESK_DEPARTMENT_ID:-}
  ZOHO_DESK_CLIENT_ID: ${ZOHO_DESK_CLIENT_ID:-}
  SETUP_ENABLED: ${SETUP_ENABLED:-false}
