  TERMS_PUBLISHED: ${TERMS_PUBLISHED:-false}
  TERMS_REVIEWED_VERSION: ${TERMS_REVIEWED_VERSION:-}
  TERMS_EFFECTIVE_DATE: ${TERMS_EFFECTIVE_DATE:-}
  TERMS_CONTACT_NAME: ${TERMS_CONTACT_NAME:-}
  TERMS_CONTACT_EMAIL: ${TERMS_CONTACT_EMAIL:-}
  TERMS_CONTACT_ADDRESS: ${TERMS_CONTACT_ADDRESS:-}
  TERMS_CONTACT_PHONE: ${TERMS_CONTACT_PHONE:-}
  TERMS_CONTACT_DESIGNATION: ${TERMS_CONTACT_DESIGNATION:-}
