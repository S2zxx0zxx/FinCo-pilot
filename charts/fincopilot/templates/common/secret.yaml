{{- $environment := lower (toString .Values.config.deploymentEnvironment) }}
{{- if and (eq $environment "production") (not .Values.global.existingSecret) }}
{{- fail "FinCo-Pilot production requires global.existingSecret; do not render production credentials from committed values files" }}
{{- end }}
{{- if and (eq $environment "production") .Values.postgresql.enabled }}
{{- fail "FinCo-Pilot production requires external PostgreSQL; set postgresql.enabled=false and supply DATABASE_URL through global.existingSecret" }}
{{- end }}
{{- if and (eq $environment "production") (ne (lower (toString .Values.config.databaseExternalRequired)) "true") }}
{{- fail "FinCo-Pilot production requires config.databaseExternalRequired=true" }}
{{- end }}
{{- if and (eq $environment "production") (not (has (lower (toString .Values.config.dbSslMode)) (list "require" "verify-ca" "verify-full"))) }}
{{- fail "FinCo-Pilot production requires encrypted PostgreSQL transport via config.dbSslMode=require|verify-ca|verify-full" }}
{{- end }}
{{- if and (eq $environment "production") .Values.redis.enabled }}
{{- fail "FinCo-Pilot production requires external Redis; set redis.enabled=false and supply REDIS_URL through global.existingSecret" }}
{{- end }}
{{- if and (eq $environment "production") (ne (lower (toString .Values.config.redisExternalRequired)) "true") }}
{{- fail "FinCo-Pilot production requires config.redisExternalRequired=true" }}
{{- end }}
{{- if and (eq $environment "production") (ne (lower (toString .Values.config.redisTlsRequired)) "true") }}
{{- fail "FinCo-Pilot production requires config.redisTlsRequired=true" }}
{{- end }}
{{- if and (eq $environment "production") (ne (lower (toString .Values.config.redisAuthRequired)) "true") }}
{{- fail "FinCo-Pilot production requires config.redisAuthRequired=true" }}
{{- end }}
{{- if and (eq $environment "production") (ne (lower (toString .Values.config.storageProvider)) "s3") }}
{{- fail "FinCo-Pilot production requires external S3-compatible object storage; set config.storageProvider=s3" }}
{{- end }}
{{- if and (eq $environment "production") (ne (lower (toString .Values.config.requireObjectStorage)) "true") }}
{{- fail "FinCo-Pilot production requires config.requireObjectStorage=true" }}
{{- end }}
{{- if and (eq $environment "production") (ne (lower (toString .Values.config.storageS3Vendor)) "cloudflare_r2") }}
{{- fail "FinCo-Pilot production roadmap #16 selects Cloudflare R2; set config.storageS3Vendor=cloudflare_r2" }}
{{- end }}
{{- if and (eq $environment "production") (empty .Values.config.storageS3Bucket) }}
{{- fail "FinCo-Pilot production requires config.storageS3Bucket" }}
{{- end }}
{{- if and (eq $environment "production") (ne (lower (toString .Values.config.storageS3Region)) "auto") }}
{{- fail "Cloudflare R2 production storage requires config.storageS3Region=auto" }}
{{- end }}
{{- if and (eq $environment "production") (empty .Values.config.storageS3EndpointUrl) }}
{{- fail "FinCo-Pilot production requires config.storageS3EndpointUrl" }}
{{- end }}
{{- if and (eq $environment "production") (ne (lower (toString .Values.config.requireFxProvider)) "true") }}
{{- fail "FinCo-Pilot production requires config.requireFxProvider=true" }}
{{- end }}
{{- if and (eq $environment "production") (ne (lower (toString .Values.config.fxAllowUnsafe1to1Fallback)) "false") }}
{{- fail "FinCo-Pilot production requires config.fxAllowUnsafe1to1Fallback=false" }}
{{- end }}
{{- if and (eq $environment "production") (ne (lower (toString .Values.config.fxSyncMode)) "scheduled") }}
{{- fail "FinCo-Pilot production requires config.fxSyncMode=scheduled" }}
{{- end }}
{{- if not .Values.global.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fincopilot.fullname" . }}-secrets
  labels:
    {{- include "fincopilot.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret }}
  {{- if $value }}
  {{ $key | snakecase | upper }}: {{ tpl (print $value) $ | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
