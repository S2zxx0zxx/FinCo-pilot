<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="FinCo-Pilot" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinCo-Pilot" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
    <meta name="theme-color" content="#000000" data-finco-dynamic="true" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/finco-favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>FinCo-Pilot</title>
    <script>
      ;(() => {
        try {
          const theme = localStorage.getItem('theme') || 'dark'
          document.documentElement.classList.toggle('dark', theme !== 'light')
          document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark'
        } catch {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <style>
      html,body,#root{min-height:100%;margin:0}body{background:#000;color:#fafafa}html:not(.dark) body{background:#fafafa;color:#09090b}
      #finco-boot{position:fixed;inset:0;z-index:220;display:grid;place-items:center;background:inherit;color:inherit;overflow:hidden;opacity:1;transition:opacity 90ms ease-out,visibility 90ms ease-out}
      #finco-boot.finco-boot--leaving{opacity:0;visibility:hidden;pointer-events:none}
      #finco-boot-content{display:flex;flex-direction:column;align-items:center;text-align:center}
      #finco-boot-mark{position:relative;display:grid;width:64px;height:64px;place-items:center;border:1px solid currentColor;border-radius:20px;box-shadow:0 18px 44px rgb(0 0 0/.14);opacity:.94}
      #finco-boot-mark::after{content:'';position:absolute;inset:-7px;border:1px solid currentColor;border-radius:24px;opacity:0;animation:finco-boot-halo 1.05s ease-out infinite}
      #finco-boot-logo{width:46px;height:46px;animation:finco-boot-pulse 1.05s cubic-bezier(.4,0,.2,1) infinite}
      #finco-boot-label{margin-top:15px;font:700 13px/1.2 system-ui,-apple-system,sans-serif;letter-spacing:-.02em;opacity:.88}
      #finco-boot-signal{display:flex;width:86px;margin-top:14px;align-items:center;justify-content:center;gap:4px}
      #finco-boot-signal span{width:22px;height:2px;border-radius:999px;background:currentColor;opacity:.22;transform:scaleX(.28);animation:finco-boot-signal 880ms ease-in-out infinite}
      #finco-boot-signal span:nth-child(2){animation-delay:110ms}#finco-boot-signal span:nth-child(3){animation-delay:220ms}
      @keyframes finco-boot-pulse{0%,100%{transform:scale(.96);opacity:.82}50%{transform:scale(1.025);opacity:1}}
      @keyframes finco-boot-halo{0%{transform:scale(.9);opacity:0}45%{opacity:.32}100%{transform:scale(1.14);opacity:0}}
      @keyframes finco-boot-signal{0%,100%{transform:scaleX(.28);opacity:.22}50%{transform:scaleX(1);opacity:.9}}
      @media(prefers-reduced-motion:reduce){#finco-boot{transition:none}#finco-boot-mark::after{display:none}#finco-boot-logo,#finco-boot-signal span{animation:none}}
    </style>
  </head>
  <body>
    <div id="finco-boot" role="status" aria-label="Opening FinCo-Pilot">
      <div id="finco-boot-content">
        <div id="finco-boot-mark" aria-hidden="true">
          <svg id="finco-boot-logo" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M 882.6,70.0 L 307.9,71.0 L 279.4,77.1 L 261.1,83.2 L 230.5,97.5 L 197.9,119.9 L 175.5,141.3 L 151.0,172.9 L 129.6,214.7 L 121.5,242.2 L 116.4,274.8 L 117.4,929.0 L 161.2,923.9 L 186.7,914.7 L 207.0,903.5 L 236.6,879.1 L 247.8,865.8 L 263.1,841.4 L 274.3,811.8 L 279.4,779.2 L 279.4,644.7 L 281.4,628.4 L 287.5,607.0 L 296.7,588.6 L 310.0,570.3 L 330.3,550.9 L 343.6,541.8 L 364.0,531.6 L 387.4,524.5 L 401.7,522.4 L 627.9,522.4 L 653.4,521.4 L 673.7,516.3 L 684.9,510.2 L 696.1,501.0 L 804.2,367.5 L 425.1,366.5 L 397.6,370.6 L 365.0,383.8 L 344.6,398.1 L 328.3,414.4 L 261.1,495.9 L 260.0,308.4 L 266.1,281.9 L 280.4,257.5 L 293.7,244.2 L 306.9,235.1 L 329.3,225.9 L 347.7,222.8 L 723.7,222.8 L 743.0,218.8 L 765.4,207.6 L 784.8,189.2 Z" />
          </svg>
        </div>
        <div id="finco-boot-label" aria-hidden="true">FinCo-Pilot</div>
        <div id="finco-boot-signal" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
