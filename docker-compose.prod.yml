  REQUIRE_OBJECT_STORAGE: ${REQUIRE_OBJECT_STORAGE:-true}
  STORAGE_S3_VENDOR: ${STORAGE_S3_VENDOR:-cloudflare_r2}
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:?STORAGE_S3_BUCKET must name the private production bucket}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-auto}
  STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:?STORAGE_S3_ENDPOINT_URL must be the private S3 API origin}
  STORAGE_S3_PREFIX: ${STORAGE_S3_PREFIX:-fincopilot-prod}
  STORAGE_S3_REQUEST_TIMEOUT_SECONDS: ${STORAGE_S3_REQUEST_TIMEOUT_SECONDS:-30}
  STORAGE_S3_PRESIGN_TTL_SECONDS: ${STORAGE_S3_PRESIGN_TTL_SECONDS:-300}
  AGENTS_EXTERNAL_MCP_URL: ${AGENTS_EXTERNAL_MCP_URL:-}
  AGENTS_KNOWLEDGE_STORAGE_PATH: /app/data/agent_knowledge
  AGENTS_ENABLED: ${AGENTS_ENABLED:-false}
  AGENTS_BUILTIN_MCP_URL: ${AGENTS_BUILTIN_MCP_URL:-http://mcp-server:8765/mcp}
  AGENTS_EXTRA_MCP_SERVERS: ${AGENTS_EXTRA_MCP_SERVERS:-}
  AGENTS_MCP_EXTERNAL_TTL_DAYS: ${AGENTS_MCP_EXTERNAL_TTL_DAYS:-90}
  AGENTS_CORE_COPILOT_DAILY_MESSAGES: ${AGENTS_CORE_COPILOT_DAILY_MESSAGES:-50}
  AGENTS_CORE_COPILOT_MAX_OUTPUT_TOKENS: ${AGENTS_CORE_COPILOT_MAX_OUTPUT_TOKENS:-1200}
  AGENTS_DEFAULT_PROVIDER: ${AGENTS_DEFAULT_PROVIDER:-ollama}
  AGENTS_DEFAULT_MODEL: ${AGENTS_DEFAULT_MODEL:-}
  AGENTS_OLLAMA_BASE_URL: ${AGENTS_OLLAMA_BASE_URL:-http://ollama:11434}
  AGENTS_OPENAI_COMPAT_BASE_URL: ${AGENTS_OPENAI_COMPAT_BASE_URL:-}
  AGENTS_EMBEDDING_PROVIDER: ${AGENTS_EMBEDDING_PROVIDER:-native}
  AGENTS_EMBEDDING_OPENAI_BASE_URL: ${AGENTS_EMBEDDING_OPENAI_BASE_URL:-https://api.openai.com/v1}
  AGENTS_EMBEDDING_MODEL: ${AGENTS_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}

x-backend-base: &backend-base
  image: ghcr.io/s2zxx0zxx/fincopilot-backend:${FINCOPILOT_VERSION:?FINCOPILOT_VERSION must pin an immutable release tag}
  environment: *backend-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ${FINCOPILOT_SECRETS_DIR:?FINCOPILOT_SECRETS_DIR must point to a host-only secret directory}:/run/secrets:ro
    - agent_knowledge:/app/data/agent_knowledge
    - agent_embedding_models:/app/data/embedding_models
  restart: unless-stopped

services:
  redis:
    # Explicit local/self-hosted fallback only. The production default is an
    # external secret-managed rediss:// target and does not start this service.
    profiles: ["bundled-redis"]
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12

  db:
    # Explicit fallback only. Production defaults to an external managed
    # PostgreSQL target supplied by DATABASE_URL.
    profiles: ["bundled-db"]
    image: ${DB_IMAGE:-docker.io/pgvector/pgvector:pg16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-fincopilot}
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    <<: *backend-base
    command: >-
      sh -c "alembic upgrade head &&
      python -m scripts.verify_production_postgres &&
      python -m scripts.verify_production_redis --redis-only &&
      python -m scripts.verify_production_object_storage &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # Loopback-only diagnostics. Public traffic must reach the backend through
    # the bundled frontend/reverse proxy so trusted-proxy rate limiting cannot
    # be bypassed with spoofed X-Forwarded-For headers.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    image: ghcr.io/s2zxx0zxx/fincopilot-frontend:${FINCOPILOT_VERSION:?FINCOPILOT_VERSION must pin an immutable release tag}
    # Host-local diagnostics only. Public traffic enters through the selected
    # edge/reverse proxy (Cloudflare Tunnel in the zero-cost launch path).
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    environment:
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  cloudflared:
    profiles: ["cloudflare-edge"]
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.9.3}
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    depends_on:
      frontend:
        condition: service_started
    secrets:
      - cloudflare_tunnel_token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  celery-worker:
    <<: *backend-base
    command: >-
      celery -A app.worker worker
      --loglevel=info
      --hostname=worker@%h
      --concurrency=${CELERY_CONCURRENCY:-4}
      --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-200}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A app.worker inspect ping
          -d "worker@$$HOSTNAME" --timeout=5 2>/dev/null | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 90s

  celery-beat:
    <<: *backend-base
    command: >-
      celery -A app.worker beat
      --loglevel=info
      --pidfile=/tmp/celerybeat.pid
      --schedule=/tmp/celerybeat-schedule
    healthcheck:
      test:
        - CMD-SHELL
        - 'test -s /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

  mcp-server:
    <<: *backend-base
    profiles: [agents]
    command: uvicorn mcp_server.main:app --host 0.0.0.0 --port 8765
    ports:
      - "${AGENTS_MCP_EXTERNAL_HOST_PORT:-127.0.0.1:8765}:8765"

secrets:
  cloudflare_tunnel_token:
    file: ${FINCOPILOT_SECRETS_DIR:?FINCOPILOT_SECRETS_DIR must point to a host-only secret directory}/cloudflare_tunnel_token
  postgres_password:
    file: ${FINCOPILOT_SECRETS_DIR:?FINCOPILOT_SECRETS_DIR must point to a host-only secret directory}/postgres_password

volumes:
  pgdata:
  redis_data:
  agent_knowledge:
  agent_embedding_models:
