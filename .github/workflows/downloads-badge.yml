name: Downloads Badge Data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge-data:
    name: Refresh FinCo-Pilot download badge data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch GHCR download counts
        shell: bash
        run: |
          set -euo pipefail
          count() {
            curl -sfL "https://github.com/S2zxx0zxx/FinCo-pilot/pkgs/container/$1" \
              | grep -A1 'Total downloads' \
              | grep -oE 'title="[0-9]+"' \
              | grep -oE '[0-9]+' || true
          }

          backend=$(count fincopilot-backend)
          frontend=$(count fincopilot-frontend)
          backend=${backend:-0}
          frontend=${frontend:-0}
          min=$(( backend < frontend ? backend : frontend ))

          pretty=$(awk -v n="$min" 'BEGIN {
            if (n < 1000) { out = sprintf("%d", n) }
            else {
              k = n / 1000
              out = (k < 10) ? sprintf("%.1f", k) : sprintf("%.0f", k)
              sub(/\.0$/, "", out)
              out = out "k"
            }
            printf "%s", out
          }')

          mkdir -p badges
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"orange"}\n' "$pretty" > badges/downloads.json

      - name: Commit badge data when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- badges/downloads.json; then
            echo "Download badge data is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add badges/downloads.json
          git commit -m 'chore: refresh FinCo-Pilot download badge data'
          git push
