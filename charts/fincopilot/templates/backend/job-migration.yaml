apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fincopilot.fullname" . }}-migration
  labels:
    {{- include "fincopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "fincopilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              python scripts/prepare_release.py
          envFrom:
            - configMapRef:
                name: {{ include "fincopilot.fullname" . }}-config
            - secretRef:
                {{- if .Values.global.existingSecret }}
                name: {{ .Values.global.existingSecret }}
                {{- else }}
                name: {{ include "fincopilot.fullname" . }}-secrets
                {{- end }}
          {{- if .Values.backend.resources }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- end }}
