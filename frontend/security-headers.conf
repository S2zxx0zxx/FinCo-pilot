# Included at server level AND locations with add_header, because nginx does
# not inherit parent add_header directives when a location defines its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Strict-Transport-Security $finco_hsts always;
# Preserve Clerk/bank provider compatibility. Strict script CSP and Trusted
# Types enforcement require provider acceptance; report-only does not certify it.
add_header Content-Security-Policy $finco_csp always;
add_header Content-Security-Policy-Report-Only $finco_strict_report always;
add_header Content-Security-Policy-Report-Only $finco_tt_policy always;
