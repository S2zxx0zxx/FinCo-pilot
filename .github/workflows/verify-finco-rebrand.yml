name: Verify FinCo-Pilot Rebrand

on:
  push:
    branches:
      - rebrand/finco-pilot-zero-legacy

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify legacy identity text is absent
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='securo|usesecuro|securo-finance|tassionoronha|(^|[^a-z])tassio([^a-z]|$)|rUqTKtQ9S4|ae627b744aaa2ba89d850ea541c311be|shell-logo|ShellLogo'
          if git grep -nEi "$PATTERN" -- . ':(exclude)LICENSE' ':(exclude).github/workflows/verify-finco-rebrand.yml'; then
            echo 'Legacy identity text remains in the current branch.' >&2
            exit 1
          fi

      - name: Verify legacy identity paths are absent
        shell: bash
        run: |
          set -euo pipefail
          findings=$(find . -path './.git' -prune -o \( -iname '*securo*' -o -iname '*shell-logo*' \) -print)
          if [ -n "$findings" ]; then
            printf '%s\n' "$findings" >&2
            exit 1
          fi

      - name: Verify image metadata has no legacy brand strings
        shell: bash
        run: |
          set -euo pipefail
          if find docs favicons frontend/public -type f \( -iname '*.png' -o -iname '*.ico' \) -print0 | xargs -0 strings | grep -Ei 'securo|usesecuro|tassionoronha'; then
            echo 'Legacy identity metadata remains in an image asset.' >&2
            exit 1
          fi

      - name: Validate Python syntax and migration chain
        run: |
          python -m compileall -q backend/app backend/mcp_server backend/scripts
          python backend/scripts/check_migration_chain.py

      - name: Validate diff whitespace
        run: git diff --check main...HEAD
