{{- if and .Values.persistence.attachments.enabled (eq (lower (toString .Values.config.storageProvider)) "local") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fincopilot.fullname" . }}-attachments
  labels:
    {{- include "fincopilot.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.attachments.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.attachments.size | quote }}
  {{- if .Values.persistence.attachments.storageClass }}
  {{- if (eq "-" .Values.persistence.attachments.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: "{{ .Values.persistence.attachments.storageClass }}"
  {{- end }}
  {{- end }}
{{- end }}
